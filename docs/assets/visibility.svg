<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">三个 Agent 各自掌握的信息</title>
<desc id="desc">User Agent 逐步了解问题；Code Agent 根据用户消息处理代码；Judger 根据完整 issue 和可选参考修复独立检查。</desc>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#23364b}.title{font-size:26px;font-weight:700}.name{font-size:26px;font-weight:700}.body{font-size:20px}.note{font-size:18px;fill:#506981}</style>
<rect width="1120" height="420" rx="20" fill="#f5f8fc"/>
<text x="40" y="52" class="title">同一个问题，三个不同的信息视角</text>
<rect x="40" y="105" width="320" height="258" rx="18" fill="#e0edff" stroke="#86a9d4"/>
<text x="200" y="151" text-anchor="middle" class="name">User Agent</text>
<text x="70" y="200" class="body">逐步补充的需求信息</text><text x="70" y="241" class="body">Code Agent 的实际回复</text><text x="70" y="282" class="body">Judger 提供的使用现象</text>
<text x="70" y="332" class="note">结合当前已知情况表达需求</text>
<rect x="400" y="105" width="320" height="258" rx="18" fill="#e0f2ed" stroke="#87b7a6"/>
<text x="560" y="151" text-anchor="middle" class="name">Code Agent</text>
<text x="430" y="200" class="body">User Agent 发出的消息</text><text x="430" y="241" class="body">当前项目代码</text><text x="430" y="282" class="body">自己的修改和运行结果</text>
<text x="430" y="332" class="note">通过对话理解用户要解决的问题</text>
<rect x="760" y="105" width="320" height="258" rx="18" fill="#fff1d8" stroke="#d8b772"/>
<text x="920" y="151" text-anchor="middle" class="name">Judger</text>
<text x="790" y="200" class="body">完整的当前 issue</text><text x="790" y="241" class="body">Code Agent 的实际实现</text><text x="790" y="282" class="body">可选的参考修复</text>
<text x="790" y="332" class="note">独立判断是否满足完整需求</text>
</svg>
